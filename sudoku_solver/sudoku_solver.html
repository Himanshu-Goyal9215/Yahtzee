<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .instructions {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 1px;
            background: #333;
            border: 3px solid #333;
            border-radius: 8px;
            margin: 20px auto;
            max-width: 450px;
            width: 100%;
        }

        .cell {
            background: white;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            background: transparent;
            outline: none;
        }

        .cell input:focus {
            background: #e3f2fd;
        }

        /* 3x3 box borders */
        .cell:nth-child(3n) {
            border-right: 2px solid #333;
        }

        .cell:nth-child(9n) {
            border-right: none;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }

        .cell:nth-child(n+28):nth-child(-n+36),
        .cell:nth-child(n+55):nth-child(-n+63) {
            border-bottom: 2px solid #333;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .btn-solve {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .btn-solve:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-reset {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        .btn-clear {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            color: white;
        }

        .btn-clear:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 152, 0, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .example-puzzle {
            text-align: center;
            margin: 20px 0;
        }

        .example-puzzle button {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .example-puzzle button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .sudoku-grid {
                max-width: 350px;
            }
            
            .cell input {
                font-size: 1em;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Sudoku Solver</h1>
        
        <div class="instructions">
            Enter the known numbers in the grid below and click "Solve" to find the solution.
            Leave empty cells as blank for the solver to fill in.
        </div>

        <div class="example-puzzle">
            <button onclick="loadExamplePuzzle()">Load Example Puzzle</button>
        </div>

        <div class="sudoku-grid" id="sudokuGrid">
            <!-- Grid will be generated by JavaScript -->
        </div>

        <div class="buttons">
            <button class="btn btn-solve" onclick="solveSudoku()">Solve</button>
            <button class="btn btn-clear" onclick="clearGrid()">Clear</button>
            <button class="btn btn-reset" onclick="resetGrid()">Reset</button>
        </div>

        <div id="status" class="status" style="display: none;"></div>
    </div>

    <script>
        let originalBoard = [];
        let currentBoard = [];

        // Initialize the Sudoku grid
        function initializeGrid() {
            const grid = document.getElementById('sudokuGrid');
            grid.innerHTML = '';
            
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.id = `cell-${i}-${j}`;
                    input.placeholder = '';
                    
                    // Only allow numbers 1-9
                    input.addEventListener('input', function(e) {
                        const value = e.target.value;
                        if (value && !/^[1-9]$/.test(value)) {
                            e.target.value = '';
                        }
                    });
                    
                    cell.appendChild(input);
                    grid.appendChild(cell);
                }
            }
            
            // Initialize empty boards
            originalBoard = Array(9).fill().map(() => Array(9).fill(0));
            currentBoard = Array(9).fill().map(() => Array(9).fill(0));
        }

        // Load example puzzle
        function loadExamplePuzzle() {
            const examplePuzzle = [
                [7, 0, 2, 0, 5, 0, 6, 0, 0],
                [0, 0, 0, 0, 0, 3, 0, 0, 0],
                [1, 0, 0, 0, 0, 9, 5, 0, 0],
                [8, 0, 0, 0, 0, 0, 0, 9, 0],
                [0, 4, 3, 0, 0, 0, 7, 5, 0],
                [0, 9, 0, 0, 0, 0, 0, 0, 8],
                [0, 0, 9, 7, 0, 0, 0, 0, 5],
                [0, 0, 0, 2, 0, 0, 0, 0, 0],
                [0, 0, 7, 0, 4, 0, 2, 0, 3]
            ];
            
            fillGrid(examplePuzzle);
            showStatus('Example puzzle loaded!', 'info');
        }

        // Fill the grid with a board
        function fillGrid(board) {
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const input = document.getElementById(`cell-${i}-${j}`);
                    if (board[i][j] === 0) {
                        input.value = '';
                    } else {
                        input.value = board[i][j];
                    }
                }
            }
            
            // Update current board
            currentBoard = board.map(row => [...row]);
        }

        // Get current board from grid
        function getCurrentBoard() {
            const board = [];
            for (let i = 0; i < 9; i++) {
                board[i] = [];
                for (let j = 0; j < 9; j++) {
                    const input = document.getElementById(`cell-${i}-${j}`);
                    const value = input.value.trim();
                    board[i][j] = value === '' ? 0 : parseInt(value);
                }
            }
            return board;
        }

        // Clear the grid
        function clearGrid() {
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const input = document.getElementById(`cell-${i}-${j}`);
                    input.value = '';
                }
            }
            currentBoard = Array(9).fill().map(() => Array(9).fill(0));
            hideStatus();
        }

        // Reset to original state
        function resetGrid() {
            fillGrid(originalBoard);
            hideStatus();
        }

        // Show status message
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        // Hide status message
        function hideStatus() {
            const status = document.getElementById('status');
            status.style.display = 'none';
        }

        // Solve the Sudoku puzzle
        function solveSudoku() {
            const board = getCurrentBoard();
            
            // Validate input
            if (!isValidInput(board)) {
                showStatus('Please enter a valid Sudoku puzzle!', 'error');
                return;
            }
            
            // Store original board
            originalBoard = board.map(row => [...row]);
            
            // Try to solve
            const solution = solvePuzzle(board);
            
            if (solution) {
                fillGrid(solution);
                showStatus('Sudoku solved successfully!', 'success');
            } else {
                showStatus('This Sudoku puzzle is unsolvable!', 'error');
            }
        }

        // Validate input
        function isValidInput(board) {
            // Check for duplicate numbers in rows, columns, and boxes
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    if (board[i][j] !== 0) {
                        const num = board[i][j];
                        board[i][j] = 0; // Temporarily remove
                        
                        if (!isValidPlacement(board, num, i, j)) {
                            board[i][j] = num; // Restore
                            return false;
                        }
                        
                        board[i][j] = num; // Restore
                    }
                }
            }
            return true;
        }

        // Check if a number can be placed at a position
        function isValidPlacement(board, number, row, column) {
            // Check row
            for (let i = 0; i < 9; i++) {
                if (board[row][i] === number) return false;
            }
            
            // Check column
            for (let i = 0; i < 9; i++) {
                if (board[i][column] === number) return false;
            }
            
            // Check 3x3 box
            const boxRow = Math.floor(row / 3) * 3;
            const boxCol = Math.floor(column / 3) * 3;
            
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    if (board[boxRow + i][boxCol + j] === number) return false;
                }
            }
            
            return true;
        }

        // Solve the puzzle using backtracking
        function solvePuzzle(board) {
            const solution = board.map(row => [...row]);
            
            if (solveBoard(solution)) {
                return solution;
            }
            return null;
        }

        // Recursive solving function
        function solveBoard(board) {
            for (let row = 0; row < 9; row++) {
                for (let column = 0; column < 9; column++) {
                    if (board[row][column] === 0) {
                        for (let numberToTry = 1; numberToTry <= 9; numberToTry++) {
                            if (isValidPlacement(board, numberToTry, row, column)) {
                                board[row][column] = numberToTry;

                                if (solveBoard(board)) {
                                    return true;
                                } else {
                                    board[row][column] = 0;
                                }
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            initializeGrid();
        });
    </script>
</body>
</html>
